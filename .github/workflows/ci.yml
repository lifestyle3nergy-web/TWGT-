name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Repository Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate repository contract
        run: node scripts/validate-repository-contract.mjs

      - name: Validate YAML
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' "$file"
          done < <(find . -type f \( -name '*.yml' -o -name '*.yaml' \) -not -path './.git/*' -print0)

      - name: Validate diff formatting
        run: git diff --check

  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
    needs: governance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Display repository structure
        shell: bash
        run: |
          echo "Repository checked out successfully."
          echo
          echo "Git status:"
          git status --short --branch
          echo
          echo "Top-level structure:"
          find . -maxdepth 2 \
            -type f \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            | sort

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Display toolchain versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency tree
        run: npm ls --depth=0

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twgt_ci
        run: npx prisma validate

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twgt_ci
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run lint and typecheck
        run: npm run lint

      - name: Validate build imports and entrypoint syntax
        run: |
          node --check dist/index.js
          node scripts/validate-dist-imports.mjs

      - name: Git diff validation
        run: git diff --check

  prisma-migration:
    name: Validate Prisma Migration
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twgt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d twgt_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twgt_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to isolated PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status
