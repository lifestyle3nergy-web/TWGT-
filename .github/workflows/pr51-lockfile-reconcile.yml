name: PR51 Lockfile Reconcile

on:
  push:
    branches:
      - security/pr51-runtime-only
  pull_request:
    branches:
      - main
    paths:
      - package-lock.json
      - package.json
      - .github/workflows/pr51-lockfile-reconcile.yml

permissions:
  contents: write

concurrency:
  group: pr51-lockfile-reconcile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/pr51-runtime-only
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - name: Reconcile security-only lockfile
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.json.before
          npm update fast-uri find-my-way postcss nanoid --package-lock-only --ignore-scripts
          cmp --silent package.json /tmp/package.json.before || {
            echo 'package.json changed unexpectedly'
            git diff -- package.json
            exit 1
          }
      - name: Verify targeted versions and ESLint hold
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.packages?.['']?.devDependencies?.eslint !== '^9.0.0') {
            throw new Error(`eslint drifted: ${lock.packages?.['']?.devDependencies?.eslint}`);
          }
          const expected = {
            'fast-uri': new Set(['3.1.7', '4.1.4']),
            'find-my-way': new Set(['9.9.0']),
            postcss: new Set(['8.5.28']),
            nanoid: new Set(['3.3.18']),
          };
          const seen = Object.fromEntries(Object.keys(expected).map((k) => [k, new Set()]));
          for (const [path, meta] of Object.entries(lock.packages ?? {})) {
            for (const name of Object.keys(expected)) {
              if (path === `node_modules/${name}` || path.endsWith(`/node_modules/${name}`)) {
                if (!expected[name].has(meta.version)) {
                  throw new Error(`${name} unexpected version ${meta.version} at ${path}`);
                }
                seen[name].add(meta.version);
              }
            }
          }
          for (const [name, versions] of Object.entries(expected)) {
            for (const version of versions) {
              if (!seen[name].has(version)) throw new Error(`${name}@${version} not present`);
            }
          }
          NODE
          npm ls fast-uri find-my-way postcss nanoid --all
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain -- package-lock.json)" || {
            echo 'No lockfile change produced'
            exit 1
          }
          test -z "$(git status --porcelain -- package.json)" || {
            echo 'package.json changed unexpectedly'
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): reconcile runtime dependency lockfile'
          git push origin HEAD:security/pr51-runtime-only
