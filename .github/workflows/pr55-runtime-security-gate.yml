name: PR55 Runtime Security Gate

on:
  push:
    branches:
      - security/pr51-runtime-only
  pull_request:
    branches:
      - main
    paths:
      - package-lock.json
      - .github/workflows/pr55-runtime-security-gate.yml

permissions:
  contents: read

jobs:
  targeted-runtime-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/pr51-runtime-only
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - name: Frozen install and audit
        run: |
          npm ci
          npm audit --audit-level=high
          npm ls fast-uri find-my-way postcss nanoid --all
      - name: Routing and authenticated Fastify smoke
        run: |
          node --input-type=module <<'NODE'
          import Fastify from 'fastify';
          import fastifyJwt from '@fastify/jwt';

          const app = Fastify({ logger: false });
          await app.register(fastifyJwt, { secret: 'synthetic-ci-only-secret-with-sufficient-length' });
          app.get('/route/:id', async (request) => ({ id: request.params.id }));
          app.get('/protected', {
            preHandler: async (request, reply) => {
              try { await request.jwtVerify(); }
              catch { return reply.code(401).send({ error: 'unauthorized' }); }
            },
          }, async (request) => ({ subject: request.user.sub }));
          await app.ready();

          const route = await app.inject({ method: 'GET', url: '/route/security-check' });
          if (route.statusCode !== 200 || route.json().id !== 'security-check') {
            throw new Error(`routing regression: ${route.statusCode} ${route.body}`);
          }

          const absolute = await app.inject({ method: 'GET', url: 'http://example.test/route/absolute-form' });
          if (absolute.statusCode !== 200 || absolute.json().id !== 'absolute-form') {
            throw new Error(`absolute-form routing regression: ${absolute.statusCode} ${absolute.body}`);
          }

          const denied = await app.inject({ method: 'GET', url: '/protected' });
          if (denied.statusCode !== 401) {
            throw new Error(`unauthenticated request was not rejected: ${denied.statusCode}`);
          }

          const token = app.jwt.sign({ sub: 'synthetic-ci-user' });
          const allowed = await app.inject({
            method: 'GET',
            url: '/protected',
            headers: { authorization: `Bearer ${token}` },
          });
          if (allowed.statusCode !== 200 || allowed.json().subject !== 'synthetic-ci-user') {
            throw new Error(`authenticated Fastify smoke failed: ${allowed.statusCode} ${allowed.body}`);
          }
          await app.close();
          NODE
      - name: PostCSS regression
        run: |
          node --input-type=module <<'NODE'
          import postcss from 'postcss';
          import { nanoid } from 'nanoid';
          const input = '.twgt { display: grid; user-select: none; }';
          const result = await postcss([]).process(input, { from: undefined });
          if (result.css !== input) throw new Error(`PostCSS output changed unexpectedly: ${result.css}`);
          const id = nanoid();
          if (typeof id !== 'string' || id.length === 0) throw new Error('Nano ID generation failed');
          NODE
      - name: Build and regression suite
        run: |
          npm run lint
          npm test
          npm run build
          node --check dist/index.js
          node scripts/validate-dist-imports.mjs
          git diff --check
