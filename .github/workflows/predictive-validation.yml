name: Predictive Risk Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/contracts/ExecutionEnvelope.ts'
      - 'src/services/ChangeClassifierService.ts'
      - 'src/services/EvidenceCollectorService.ts'
      - 'src/services/RiskScoringService.ts'
      - 'src/policies/pr-risk-policy.json'
      - 'tests/fixtures/predictive-risk/**'
      - 'tests/services/PredictiveRiskServices.test.ts'
      - '.github/workflows/predictive-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: predictive-risk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/services/PredictiveRiskServices.test.ts
      - run: npm run build
      - name: Validate policy schema and safety boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const policy = JSON.parse(readFileSync('src/policies/pr-risk-policy.json', 'utf8'));
          if (policy.version !== '1.0.0') throw new Error('Unsupported policy version');
          if (policy.humanApprovalRequired !== true) throw new Error('Human approval must remain mandatory');
          if (policy.productionMutationAllowed !== false) throw new Error('Production mutation must remain disabled');
          NODE
      - run: git diff --check
