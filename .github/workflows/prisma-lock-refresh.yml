name: Validate Prisma 7 Dependency Override

on:
  push:
    branches:
      - dependabot/npm_and_yarn/prisma-7.10.0

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/prisma-7.10.0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Regenerate lockfile with npm install
        run: npm install

      - name: Verify npm ci with regenerated lockfile
        run: |
          rm -rf node_modules
          npm ci
          npm ls deepmerge-ts --all

      - name: Commit regenerated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/prisma-lock-refresh.yml
          git diff --cached --check
          git commit -m "chore: regenerate lockfile with scoped Prisma security override"
          git push origin HEAD:dependabot/npm_and_yarn/prisma-7.10.0
