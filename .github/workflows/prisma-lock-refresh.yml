name: Regenerate Prisma 7 Lockfile and Initial Migration

on:
  push:
    branches:
      - dependabot/npm_and_yarn/prisma-7.10.0

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: twgt_prisma_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d twgt_prisma_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/prisma-7.10.0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Regenerate lockfile with npm install
        run: npm install

      - name: Validate Prisma schema and generate client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twgt_prisma_ci
        run: |
          npx prisma validate
          npx prisma generate

      - name: Create and apply initial migration in isolated PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twgt_prisma_ci
        run: npx prisma migrate dev --name init

      - name: Verify migration history from clean database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/twgt_prisma_ci
        run: npx prisma migrate status

      - name: Commit generated artifacts and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations
          git rm .github/workflows/prisma-lock-refresh.yml
          git diff --cached --check
          git commit -m "chore: complete Prisma 7 migration artifacts"
          git push origin HEAD:dependabot/npm_and_yarn/prisma-7.10.0
