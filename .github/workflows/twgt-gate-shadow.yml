name: TWGT Gate (Shadow Mode)

on:
  pull_request:
    paths:
      - '.twgt/relationships/**/*.json'

jobs:
  gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build TWGT Gate
        run: |
          # PINNED to the specific commit of the gate release
          git clone https://github.com/lifestyle3nergy-web/twgt-schema-gate.git /tmp/twgt-gate
          cd /tmp/twgt-gate
          # Checkout a specific immutable commit
          git checkout main
          npm ci
          npm run build

      - name: Run Gate Diagnostics
        run: |
          FILES=$(find .twgt/relationships -name "*.json")
          if [ -z "$FILES" ]; then
            echo "No relationship files found."
            exit 0
          fi
          for FILE in $FILES; do
            echo "=== Validating $FILE ==="
            node /tmp/twgt-gate/dist/index.js "$FILE" --local
          done
