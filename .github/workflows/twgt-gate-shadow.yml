name: TWGT Gate (Shadow Mode)

on:
  pull_request:
    paths:
      - '.twgt/relationships/**/*.json'

jobs:
  gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup OPA
        run: |
          curl -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa run --server --addr localhost:8181 /tmp/twgt-gate/policies/ &

      - name: Build TWGT Gate
        run: |
          git clone https://github.com/lifestyle3nergy-web/twgt-schema-gate.git /tmp/twgt-gate
          cd /tmp/twgt-gate
          # PINNED to the exact immutable commit
          git checkout 2218a654c7e0e46e0ed980434066557ab5aac550
          npm ci
          npm run build

      - name: Run Gate Diagnostics
        run: |
          FILES=$(find .twgt/relationships -name "*.json")
          if [ -z "$FILES" ]; then
            echo "No relationship files found."
            exit 0
          fi
          for FILE in $FILES; do
            echo "=== Validating $FILE ==="
            # Removed --local so it hits the OPA server
            node /tmp/twgt-gate/dist/index.js "$FILE"
          done
