version: '3.8'

services:
  app:
    build: .
    env_file:
      - .env.example
    ports:
      - "3000:3000"
    depends_on:
      - db
      - qdrant

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: twgt
    volumes:
      - db-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  db-data:
  qdrant-data:
